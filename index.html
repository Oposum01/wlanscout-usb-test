<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wlanscout USB test</title>
<style>
:root {
    --bg: #111;
    --panel: #1b1b1b;
    --line: #333;
    --text: #ddd;
    --dim: #888;
    --ok: #8fbf8f;
    --bad: #d08080;
    --accent: #7aaed0;
}

body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, sans-serif;
}

h1 {
    font-size: 18px;
    margin: 0 0 4px;
}

.dim {
    color: var(--dim);
}

.box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px;
    margin: 12px 0;
}

button {
    background: #2a2a2a;
    border: 1px solid #555;
    color: var(--text);
    border-radius: 4px;
    padding: 8px 12px;
    margin: 0 6px 6px 0;
    font-size: 14px;
}

button:disabled {
    opacity: 0.4;
}

table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
}

td, th {
    text-align: left;
    padding: 3px 6px;
    border-bottom: 1px solid var(--line);
}

.scroll {
    overflow-x: auto;
}

pre {
    white-space: pre-wrap;
    word-break: break-all;
    font-size: 12px;
    margin: 0;
    max-height: 240px;
    overflow: auto;
}

#state.ok {
    color: var(--ok);
}

#state.bad {
    color: var(--bad);
}
</style>
</head>
<body>

<h1>wlanscout USB test</h1>
<div class="dim">
Plug the sensor's USB-C port marked <b>USB</b> (not UART) into the phone,
then connect. On Android try WebUSB first; "Show all USB devices"
tells whether the phone sees the board at all.
</div>

<div class="box">
<button id="connectUsb">Connect via WebUSB</button>
<button id="connectSerial">Connect via Web Serial</button>
<button id="disconnect" disabled>Disconnect</button>
<br>
<button id="listUsb">Show all USB devices</button>
<div>State: <span id="state">not connected</span>
<span class="dim" id="api"></span></div>
</div>

<div class="box">
<button class="req" data-path="/api/status" disabled>status</button>
<button class="req" data-path="/api/networks" disabled>networks</button>
<button class="req" data-path="/api/clients" disabled>clients</button>
<button class="req" data-path="/api/live" disabled>live</button>
<label><input type="checkbox" id="poll"> networks every 2 s</label>
</div>

<div class="box">
<b>Timings</b>
<div class="scroll">
<table>
<thead><tr><th>Path</th><th>Bytes</th><th>ms</th><th>kB/s</th><th>Result</th></tr></thead>
<tbody id="timings"></tbody>
</table>
</div>
</div>

<div class="box">
<b>Networks</b> <span class="dim" id="netinfo"></span>
<div class="scroll">
<table>
<thead><tr><th>SSID</th><th>BSSID</th><th>Ch</th><th>RSSI</th></tr></thead>
<tbody id="nets"></tbody>
</table>
</div>
</div>

<div class="box">
<b>Log</b>
<pre id="log"></pre>
</div>

<div class="box">
<b>Last answer</b>
<pre id="raw"></pre>
</div>

<script type="module">

const $ = id => document.getElementById(id);

// Some errors arrive as plain strings
const errText = e =>
    e === undefined ? "undefined"
                    : (e && e.message) || String(e);

const t0 = performance.now();
const stamp = () => ((performance.now() - t0) / 1000).toFixed(1) + " s";

// Everything that happens, newest on top
function log(text)
{
    const line = document.createElement("div");

    line.textContent = stamp() + "  " + text;
    $("log").prepend(line);
}

if (navigator.usb)
{
    navigator.usb.addEventListener("connect", e =>
        log("USB connect: " + (e.device.productName || "?")));

    navigator.usb.addEventListener("disconnect", e =>
        log("USB disconnect: " + (e.device.productName || "?") +
            " (a reset of the board looks like this)"));
}

let port = null;
let reader = null;
let writer = null;

// Bytes received but not yet part of a finished answer
let pending = [];
let waiting = null;

$("api").textContent = "(" + [
    navigator.usb ? "WebUSB" : "no WebUSB",
    navigator.serial ? "Web Serial" : "no Web Serial"].join(", ") + ")";

function setState(text, cls)
{
    $("state").textContent = text;
    $("state").className = cls || "";
}

function setConnected(on)
{
    $("connectUsb").disabled = on;
    $("connectSerial").disabled = on;
    $("disconnect").disabled = !on;
    document.querySelectorAll(".req").forEach(b => b.disabled = !on);
}

// Frames: 0x02 JSON 0x03, or 0x15 for an unknown path. Bytes
// outside a frame are dropped.
function feed(chunk)
{
    for (const b of chunk)
    {
        if (!waiting)
            continue;

        if (b === 0x15 && !waiting.started)
        {
            finish(null);
            continue;
        }

        if (b === 0x02)
        {
            waiting.started = true;
            pending = [];
            continue;
        }

        if (b === 0x03 && waiting.started)
        {
            finish(new TextDecoder().decode(new Uint8Array(pending)));
            continue;
        }

        if (waiting.started)
            pending.push(b);
    }
}

function finish(text)
{
    const w = waiting;

    waiting = null;
    pending = [];
    clearTimeout(w.timer);
    w.resolve(text);
}

async function readLoop()
{
    try
    {
        while (true)
        {
            const { value, done } = await reader.read();

            if (done)
                break;

            if (value)
                feed(value);
        }
    }
    catch (e)
    {
        setState("read error: " + errText(e), "bad");
        log("read error: " + errText(e));
    }
}

function request(path)
{
    if (waiting)
        return Promise.reject(new Error("busy"));

    return new Promise((resolve, reject) =>
    {
        waiting = {
            started: false,
            resolve,
            timer: setTimeout(() =>
            {
                waiting = null;
                reject(new Error("timeout"));
            }, 15000)
        };

        writer.write(new TextEncoder().encode("GET " + path + "\n"))
            .catch(e => { waiting = null; reject(e); });
    });
}

async function run(path)
{
    const t0 = performance.now();
    let row = [path, "", "", "", ""];

    try
    {
        const text = await request(path);
        const ms = performance.now() - t0;

        if (text === null)
        {
            row[4] = "unknown path";
        }
        else
        {
            const bytes = new TextEncoder().encode(text).length;
            const json = JSON.parse(text);

            row = [path, bytes, ms.toFixed(0),
                   (bytes / ms).toFixed(1), "ok"];

            $("raw").textContent = text.slice(0, 4000);

            if (json.networks)
                showNetworks(json.networks);
        }
    }
    catch (e)
    {
        row[4] = errText(e);
    }

    const tr = document.createElement("tr");

    row.forEach(v =>
    {
        const td = document.createElement("td");
        td.textContent = v;
        tr.appendChild(td);
    });

    $("timings").prepend(tr);

    while ($("timings").children.length > 20)
        $("timings").lastChild.remove();
}

function showNetworks(list)
{
    $("netinfo").textContent = list.length + " networks";

    const body = $("nets");

    body.innerHTML = "";

    list.slice()
        .sort((a, b) => String(a.ssid).localeCompare(String(b.ssid)) ||
                        a.bssid.localeCompare(b.bssid))
        .forEach(n =>
        {
            const tr = document.createElement("tr");

            [n.ssid || "<hidden>", n.bssid, n.channel, n.rssi + " dBm"]
                .forEach(v =>
                {
                    const td = document.createElement("td");
                    td.textContent = v;
                    tr.appendChild(td);
                });

            body.appendChild(tr);
        });
}

/*
 * A CDC-ACM port straight over WebUSB, in place of Google's
 * web-serial-polyfill: the ESP's USB Serial/JTAG sends empty
 * packets to end a transfer, and the polyfill hands those to the
 * stream, which throws "chunk is empty". Empty packets are
 * skipped here. Same reader/writer shape as Web Serial.
 */
async function openUsbCdc()
{
    const dev = await navigator.usb.requestDevice(
        { filters: [{ vendorId: 0x303a }] });

    await dev.open();

    if (!dev.configuration)
        await dev.selectConfiguration(1);

    const ifaces = dev.configuration.interfaces;

    const ctrl = ifaces.find(i => i.alternates[0].interfaceClass === 2);
    const data = ifaces.find(i => i.alternates[0].interfaceClass === 10);

    await dev.claimInterface(ctrl.interfaceNumber);
    await dev.claimInterface(data.interfaceNumber);

    const eps = data.alternates[0].endpoints;
    const epIn = eps.find(e => e.direction === "in");
    const epOut = eps.find(e => e.direction === "out");

    // SET_CONTROL_LINE_STATE, DTR on and RTS off as the polyfill
    // did; RTS is what resets the chip
    await dev.controlTransferOut({
        requestType: "class", recipient: "interface",
        request: 0x22, value: 0x01, index: ctrl.interfaceNumber });

    log("USB: " + (dev.productName || "?") + ", interfaces " +
        ctrl.interfaceNumber + "/" + data.interfaceNumber +
        ", endpoints in " + epIn.endpointNumber + " (" +
        epIn.packetSize + " B) out " + epOut.endpointNumber);

    let closed = false;

    return {
        reader: {
            async read()
            {
                while (!closed)
                {
                    const r = await dev.transferIn(epIn.endpointNumber,
                                                   epIn.packetSize * 64);

                    if (r.status !== "ok")
                        throw new Error("USB transfer: " + r.status);

                    if (r.data && r.data.byteLength)
                        return { value: new Uint8Array(r.data.buffer,
                                     r.data.byteOffset, r.data.byteLength),
                                 done: false };
                }

                return { value: undefined, done: true };
            },
            async cancel() { closed = true; },
            releaseLock() { }
        },
        writer: {
            async write(bytes)
            {
                const r = await dev.transferOut(epOut.endpointNumber, bytes);

                if (r.status !== "ok")
                    throw new Error("USB transfer: " + r.status);
            },
            releaseLock() { }
        },
        port: {
            async close() { closed = true; await dev.close(); }
        }
    };
}

async function connectUsb()
{
    try
    {
        ({ reader, writer, port } = await openUsbCdc());

        setConnected(true);
        setState("connected (WebUSB)", "ok");
        log("port open");

        readLoop();

        run("/api/status");
    }
    catch (e)
    {
        setState(errText(e), "bad");
        log("error: " + errText(e));
    }
}

async function connect(api, filters)
{
    try
    {
        port = await api.requestPort({ filters });

        await port.open({ baudRate: 115200 });

        reader = port.readable.getReader();
        writer = port.writable.getWriter();

        setConnected(true);
        setState("connected", "ok");
        log("port open");

        readLoop();

        run("/api/status");
    }
    catch (e)
    {
        setState(errText(e), "bad");
        log("error: " + errText(e));
    }
}

// WebUSB: the path Chrome on Android has had for long
$("connectUsb").onclick = () =>
    navigator.usb
        ? connectUsb()
        : setState("this browser has no WebUSB", "bad");

// Chrome's own Web Serial, no filter: shows every port it offers
$("connectSerial").onclick = () =>
    navigator.serial
        ? connect(navigator.serial, [])
        : setState("this browser has no Web Serial", "bad");

// Does the phone see the board at all? Any USB device, no filter
$("listUsb").onclick = async () =>
{
    if (!navigator.usb)
        return setState("this browser has no WebUSB", "bad");

    try
    {
        const d = await navigator.usb.requestDevice({ filters: [] });

        setState("USB device: " +
            d.vendorId.toString(16).padStart(4, "0") + ":" +
            d.productId.toString(16).padStart(4, "0") + " " +
            (d.manufacturerName || "") + " " + (d.productName || ""),
            "ok");
    }
    catch (e)
    {
        setState(errText(e), "bad");
        log("error: " + errText(e));
    }
};

$("disconnect").onclick = async () =>
{
    $("poll").checked = false;

    try
    {
        await reader.cancel();
        reader.releaseLock();
        writer.releaseLock();
        await port.close();
    }
    catch (e)
    {
    }

    setConnected(false);
    setState("not connected");
};

document.querySelectorAll(".req").forEach(b =>
    b.onclick = () => run(b.dataset.path));

setInterval(() =>
{
    if ($("poll").checked && writer && !waiting)
        run("/api/networks");
}, 2000);
</script>
</body>
</html>
